<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Future-Tok | MS NIO Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        
        <section class="video-card">
            <video autoplay muted loop playsinline class="video-bg">
                <source src="shaun.mp4" type="video/mp4">
            </video>

            <div class="side-bar">
                <div class="action-item"><div class="icon">❤️</div><span class="count">1.2k</span></div>
                <div class="action-item"><div class="icon">💬</div><span class="count">450</span></div>
                <div class="action-item"><div class="icon">🔖</div><span class="count">89</span></div>
                <div class="action-item"><div class="icon">➡️</div><span class="count">Share</span></div>
            </div>
            
            <div class="video-info">
                <h3>@Cyber_Security_Lab</h3>
                <p>Building secure system architectures[cite: 10, 13].</p>
                <button class="portal-btn">Enter Secure Portal</button>
            </div>
        </section>

        <section class="video-card">
            <video autoplay muted loop playsinline class="video-bg">
                <source src="ogoh.mp4" type="video/mp4">
            </video>

            <div class="side-bar">
                <div class="action-item"><div class="icon">❤️</div><span class="count">2.5k</span></div>
                <div class="action-item"><div class="icon">💬</div><span class="count">800</span></div>
                <div class="action-item"><div class="icon">🔖</div><span class="count">210</span></div>
                <div class="action-item"><div class="icon">➡️</div><span class="count">Share</span></div>
            </div>

            <div class="video-info">
                <h3>@AI_Architect</h3>
                <p>Integrating AI APIs into independent software[cite: 15, 20].</p>
                <button class="portal-btn">Access AI Engine</button>
            </div>
        </section>

    </div>

</body>
</html>
